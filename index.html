<script>
const SB_URL = 'https://rnmnanbnhdskgzoqpuwt.supabase.co';
const SB_KEY = 'sb_publishable_n3sreNtRxoKFPGUtYwmt9A_tTUrcFRA';
const SB_HEADERS = {
  'apikey':        SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type':  'application/json',
  'Prefer':        'resolution=merge-duplicates,return=minimal'

// ── STATE ──
const S = {
  users:       [],
  games:       [],
  scores:      [],
  currentUser: JSON.parse(localStorage.getItem('gtf_session') || 'null'),
  page:        'leaderboard',
  loading:     true,
};
let loginMode = 'login';
let SF = { gameId:'', hole:'', strokes:'', loaded:false };
let AF = { open:false, name:'', course:'', holes:18, pars:Array(18).fill(4) };

// ── EMOJI RAIN ──
function buildRainHTML() {

  const anims = ['floatUp0','floatUp1','floatUp2','floatUp3','floatUp4'];
  const positions = [
     3.2, 11.7, 19.4, 27.8, 38.1, 44.6, 52.3, 61.9, 73.5, 81.2,
    88.6, 94.1,  6.8, 15.3, 23.9, 33.4, 41.0, 49.7, 57.5, 66.3,
    75.8, 83.4, 91.0,  1.5,  9.1, 17.6, 29.2, 36.8, 47.3, 55.9,
    64.4, 71.0, 79.6, 87.1, 97.3,  4.5, 13.8, 22.1, 43.3, 69.7

  const speeds = [7,13,9,16,11,8,14,10,18,7,12,15,9,13,6,11,17,8,14,10,7,16,12,9,13,6,15,11,18,8,7,14,10,12,16,9,13,6,11,15];
  const delays = [0,3.2,6.8,1.5,9.1,4.7,11.3,2.4,7.6,5.0,12.8,0.8,8.3,3.9,10.5,1.1,6.2,4.3,9.7,2.1,13.4,0.5,7.1,5.8,11.9,3.6,8.9,1.8,6.5,10.2,4.1,12.1,2.9,7.4,0.3,9.3,5.5,11.7,3.0,8.1];

// ── PIN ──
const PIN_CHARS = 'ACDEFGHJKMNPQRTUVWXY3479';
function genPin() { let p=''; for(let i=0;i<5;i++) p+=PIN_CHARS[Math.floor(Math.random()*PIN_CHARS.length)]; return p; }

function copyPin(pin, btnId) {
  const btn=document.getElementById(btnId);
  const done=()=>{ if(!btn)return; btn.classList.add('copied'); btn.textContent='✅ Copied!'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 Copy PIN';},2200); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(pin).then(done).catch(()=>legacyCopy(pin,done));
  else legacyCopy(pin,done);
}
function copyPinMini(pin, btnId) {
  const btn=document.getElementById(btnId);
  const done=()=>{ if(!btn)return; btn.textContent='✅'; setTimeout(()=>btn.textContent='📋',2000); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(pin).then(done).catch(()=>legacyCopy(pin,done));
  else legacyCopy(pin,done);
}
function legacyCopy(text,cb) {
  const el=Object.assign(document.createElement('textarea'),{value:text});
  el.style.cssText='position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(el); el.focus(); el.select();
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(el);
}

// ── SUPABASE ──
async function sbGet(table) {
  const r=await fetch(`${SB_URL}/rest/v1/${table}?select=*`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error(`GET ${table} failed: ${r.status}`);
  return r.json();
}
async function sbUpsert(table,rows) {
  const body=Array.isArray(rows)?rows:[rows]; if(!body.length)return;
  const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:SB_HEADERS,body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error(`UPSERT ${table} failed: ${t}`);}
}
async function sbDelete(table,match) {
  const params=Object.entries(match).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join('&');
  await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
}

async function loadAll() {
  try {
    const [users,games,scores]=await Promise.all([sbGet('users'),sbGet('games'),sbGet('scores')]);
    if(Array.isArray(users))  S.users=users;
    if(Array.isArray(games))  S.games=games;
    if(Array.isArray(scores)) S.scores=scores;
  } catch(e){console.warn('Supabase load failed:',e);}
  S.loading=false; render();
}

async function silentRefresh() {
  try {
    const [users,games,scores]=await Promise.all([sbGet('users'),sbGet('games'),sbGet('scores')]);
    if(Array.isArray(users))  S.users=users;
    if(Array.isArray(games))  S.games=games;
    if(Array.isArray(scores)) S.scores=scores;
    if(S.currentUser&&S.page==='leaderboard'){const pg=document.getElementById('page');if(pg)renderLeaderboard(pg);}
    const live=S.games.find(g=>g.status==='live');
    const badge=document.querySelector('.live-badge');
    const hdr=document.querySelector('.header-right');
    if(live&&!badge&&hdr){const d=document.createElement('div');d.className='live-badge';d.innerHTML='<span class="live-dot"></span>LIVE';hdr.prepend(d);}
    else if(!live&&badge)badge.remove();
  } catch(e){}
}
setInterval(silentRefresh,15000);

async function saveUser(user) {
  S.users=[...S.users.filter(u=>u.id!==user.id),user]; toast('saving');
  try{await sbUpsert('users',user);toast('ok');}catch(e){toast('err');}
}
async function saveScore(score) {
  S.scores=[...S.scores.filter(s=>!(s.gameId===score.gameId&&s.userId===score.userId&&s.hole===score.hole)),score]; toast('saving');
  try{await sbUpsert('scores',score);toast('ok');}catch(e){toast('err');}
}
async function persistGames(newGames) {
  const deleted=S.games.filter(g=>!newGames.find(n=>n.id===g.id));
  const upserted=newGames.filter(n=>{const old=S.games.find(g=>g.id===n.id);return !old||JSON.stringify(old)!==JSON.stringify(n);});
  S.games=newGames; toast('saving');
  try{if(upserted.length)await sbUpsert('games',upserted);for(const g of deleted)await sbDelete('games',{id:g.id});toast('ok');}catch(e){toast('err');}
}

let _tt;
function toast(s) {
  const b=document.getElementById('sync-bar');
  b.className='show '+(s==='ok'?'ok':s==='err'?'err':'');
  b.textContent=s==='saving'?'☁️  Saving…':s==='ok'?'✅  Saved to Supabase':'⚠️  Save failed — check connection';
  clearTimeout(_tt); if(s!=='saving') _tt=setTimeout(()=>b.className='',2800);
}

// ── UTILS ──
const fmtScore = r => r===0?'E':r>0?'+'+r:''+r;
const relClass = r => r<0?'under':r>0?'over':'even';
const getPars  = g => { try{return typeof g.pars==='string'?JSON.parse(g.pars):(g.pars||[]);}catch{return[];} };
const fmtDate  = iso => { if(!iso)return''; return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
const esc      = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function calcBoard(game) {
  const pars=getPars(game);
  return S.users.map(user=>{
    const us=S.scores.filter(s=>s.gameId===game.id&&s.userId===user.id);
    const strokes=us.reduce((a,s)=>a+Number(s.strokes),0);
    const par=us.reduce((a,s)=>a+(pars[s.hole-1]||4),0);
    return{user,strokes,par,holes:us.length,rel:strokes-par};
  }).filter(p=>p.holes>0).sort((a,b)=>a.rel-b.rel||a.strokes-b.strokes);
}

function doAuth() {
  const name=(document.getElementById('uname')?.value||'').trim();
  const err=document.getElementById('lerr');
  if(!name){err.innerHTML='<div class="error-msg">⚠️ Please enter a username</div>';return;}
  if(loginMode==='login'){
    const u=S.users.find(u=>u.username.toLowerCase()===name.toLowerCase());
    if(!u){err.innerHTML='<div class="error-msg">⚠️ Username not found — try registering!</div>';return;}
    S.currentUser=u;
    localStorage.setItem('gtf_session',JSON.stringify(u));
  } else {
    if(S.users.find(u=>u.username.toLowerCase()===name.toLowerCase())){
      err.innerHTML='<div class="error-msg">⚠️ That username is already taken</div>';return;
    }
    const user={id:Date.now().toString(),username:name,isAdmin:S.users.length===0,createdAt:new Date().toISOString()};
    S.currentUser=user;
    localStorage.setItem('gtf_session',JSON.stringify(user));
    saveUser(user);
  }
  renderPinJoin();
}

  const pin=(document.getElementById('pin-input')?.value||'').trim().toUpperCase();

  const game=S.games.find(g=>String(g.pin).toUpperCase()===pin);

// ── LEADERBOARD ──
function renderLeaderboard(el) {
  const live=S.games.find(g=>g.status==='live');
  const past=S.games.filter(g=>g.status==='finished').slice(-3).reverse();
  let html=`<div class="fade-up" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <h1 style="font-family:'Playfair Display',serif;color:#fef08a;font-size:24px">🏆 Leaderboard</h1>
      ${live?'<span style="font-size:12px;color:#86efac;background:rgba(22,163,74,.15);padding:3px 10px;border-radius:20px;font-weight:600">Game in progress</span>':''}
    </div>
    ${live?`<button class="btn btn-gold" style="padding:10px 20px;font-size:13px" onclick="nav('score')">✏️  Add Score</button>`:''}
  </div>`;
  if(!live&&!past.length){
    html+=`<div class="empty"><div class="icon">⛳</div><h2>No games yet</h2><p style="max-width:260px;margin:8px auto 0;line-height:1.6">An admin needs to create and start a game.</p></div>`;
  }
  if(live) html+=buildBoard(live,true);
  past.forEach(g=>html+=buildBoard(g,false));
  el.innerHTML=html;
}

function buildBoard(game,isLive) {
  const board=calcBoard(game);
  const pars=getPars(game);
  const pt=pars.reduce((a,b)=>a+b,0);
  const pinInline=(isLive&&game.pin)
    ?` · <span class="pin-inline">🔑 <span class="pin-val">${esc(game.pin)}</span> <button class="pin-mini-copy" id="mc-${game.id}" onclick="copyPinMini('${esc(game.pin)}','mc-${game.id}')" title="Copy PIN">📋</button></span>`
    :'';
  let html=`<div style="margin-bottom:30px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <h2 style="font-family:'Playfair Display',serif;color:#fef08a;font-size:20px;margin-bottom:4px">${esc(game.name)}</h2>
        <p style="color:#86efac;font-size:12px;line-height:1.6">${esc(game.course)} · ${game.holes} holes · Par ${pt}${game.startTime?' · '+fmtDate(game.startTime):''}${pinInline}</p>
      </div>
      ${isLive?'<div class="live-badge"><span class="live-dot"></span>LIVE</div>':'<div style="background:rgba(255,255,255,.07);border-radius:20px;padding:4px 14px;font-size:11px;color:#6b7280;font-weight:700">FINAL</div>'}
    </div>`;
  if(!board.length){
    html+=`<div style="background:rgba(0,0,0,.2);border-radius:14px;padding:36px;text-align:center;color:#374151;border:1px dashed rgba(255,255,255,.07)"><div style="font-size:32px;margin-bottom:8px">🏌️</div>No scores yet — get out there!</div>`;
  } else {
    html+=`<div class="card"><div class="lb-header"><span>POS</span><span>PLAYER</span><span style="text-align:center">HOLES</span><span style="text-align:center">STROKES</span><span style="text-align:right">SCORE</span></div>`;
    board.forEach((p,i)=>{
      const m=i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
      html+=`<div class="lb-row${i===0?' gold':''}">
        <span style="font-size:${i<3?18:14}px;font-weight:800;color:${i===0?'#fef08a':i===1?'#d1d5db':i===2?'#cd7f32':'#4b5563'}">${m}</span>
        <span style="font-weight:${i===0?700:500};color:${i===0?'#fff':'#d1d5db'}">${esc(p.user.username)}</span>
        <span style="text-align:center;color:#6b7280;font-size:12px">${p.holes}/${game.holes}</span>
        <span style="text-align:center;font-weight:700">${p.strokes}</span>
        <span style="text-align:right;font-weight:900;font-size:16px" class="${relClass(p.rel)}">${fmtScore(p.rel)}</span>
      </div>`;
    });
    html+=`</div>`;
  }
  return html+`</div>`;
}

// ── SCORE ENTRY ──
function renderScore(el) {
  const liveGames=S.games.filter(g=>g.status==='live');
  if(!liveGames.length){
    el.innerHTML=`<h1 style="font-family:'Playfair Display',serif;color:#fef08a;font-size:24px;margin-bottom:24px" class="fade-up">✏️ Score Entry</h1>
      <div class="empty" style="background:rgba(0,0,0,.2);border-radius:16px;border:1px dashed rgba(255,255,255,.08)">
        <div class="icon">🏌️</div><p style="color:#6b7280;line-height:1.7">No live games right now.<br>An admin needs to start a game first.</p>
      </div>`;return;
  }
  const selGame=S.games.find(g=>g.id===SF.gameId);
  const pars=selGame?getPars(selGame):[];
  const myS=selGame?S.scores.filter(s=>s.gameId===SF.gameId&&s.userId===S.currentUser.id).sort((a,b)=>a.hole-b.hole):[];
  const exist=SF.hole?myS.find(s=>s.hole===Number(SF.hole)):null;
  if(exist&&!SF.loaded){SF.strokes=String(exist.strokes);SF.loaded=true;}
  const par=(SF.hole&&pars[Number(SF.hole)-1])?pars[Number(SF.hole)-1]:null;
  const numStr=parseInt(SF.strokes,10);
  const rel=(par&&numStr>0)?numStr-par:null;
  const canSave=!!(selGame&&SF.hole&&numStr>0);

  let scHtml='';
  if(selGame&&myS.length){
    const tot=myS.reduce((a,s)=>a+s.strokes,0),ptr=myS.reduce((a,s)=>a+(pars[s.hole-1]||4),0);
    scHtml=`<div class="card">
      <div style="padding:14px 18px;background:rgba(202,138,4,.1);border-bottom:1px solid rgba(202,138,4,.15)">
        <div style="font-family:'Playfair Display',serif;color:#fef08a;font-size:15px">My Scorecard</div>
        <div style="color:#86efac;font-size:11px;margin-top:2px">${esc(selGame.name)}</div>
      </div>
      <div class="sc-row sc-head"><span>HOLE</span><span style="text-align:center">PAR</span><span style="text-align:center">STROKES</span><span style="text-align:right">SCORE</span></div>
      <div style="max-height:250px;overflow-y:auto">
        ${myS.map(s=>{const p=pars[s.hole-1]||4,r=s.strokes-p;return`<div class="sc-row sc-body"><span style="color:#9ca3af;font-weight:600">H${s.hole}</span><span style="text-align:center;color:#6b7280">${p}</span><span style="text-align:center;font-weight:700">${s.strokes}</span><span style="text-align:right;font-weight:800" class="${relClass(r)}">${fmtScore(r)}</span></div>`;}).join('')}
      </div>
      <div class="sc-row sc-foot"><span style="color:#fef08a;font-weight:800">TOTAL</span><span style="text-align:center;color:#ca8a04;font-weight:700">${ptr}</span><span style="text-align:center;font-weight:800">${tot}</span><span style="text-align:right;font-weight:900;font-size:15px" class="${relClass(tot-ptr)}">${fmtScore(tot-ptr)}</span></div>
    </div>`;
  } else {
    scHtml=`<div style="background:rgba(0,0,0,.2);border-radius:16px;padding:40px;text-align:center;color:#374151;border:1px dashed rgba(255,255,255,.07)"><div style="font-size:36px;margin-bottom:10px">${selGame?'📋 No holes entered yet':'📋 Select a game first'}</div></div>`;
  }

  el.innerHTML=`
    <h1 style="font-family:'Playfair Display',serif;color:#fef08a;font-size:24px;margin-bottom:24px" class="fade-up">✏️ Score Entry</h1>
    <div class="two-col">
      <div class="card fade-up" style="padding:20px">
        <div style="font-family:'Playfair Display',serif;color:#fef08a;font-size:17px;margin-bottom:18px">Enter Score</div>
        <div class="form-group">
          <label class="form-label">GAME</label>
          <select class="form-select" onchange="sfGame(this.value)">
            <option value="">Select game…</option>
            ${liveGames.map(g=>`<option value="${g.id}"${SF.gameId===g.id?' selected':''}>${esc(g.name)}</option>`).join('')}
          </select>
        </div>
        ${selGame?`<div class="form-group"><label class="form-label">HOLE</label>
          <select class="form-select" onchange="sfHole(this.value)">
            <option value="">Select hole…</option>
            ${pars.map((p,i)=>{const h=i+1,done=myS.find(s=>s.hole===h);return`<option value="${h}"${SF.hole==h?' selected':''}>Hole ${h} · Par ${p}${done?' ✓':''}</option>`;}).join('')}
          </select></div>`:''}
        ${selGame&&SF.hole?`<div class="form-group">
          <label class="form-label">STROKES ${exist?'<span style="color:#fbbf24">(editing)</span>':''}</label>
          <div class="stepper">
            <button class="step-btn" onclick="adjS(-1)">−</button>
            <input class="step-val" type="number" min="1" max="20" value="${SF.strokes||''}" id="sv"
              oninput="SF.strokes=this.value;SF.loaded=true;syncSaveBtn()">
            <button class="step-btn" onclick="adjS(1)">+</button>
            ${rel!==null?`<div style="display:flex;flex-direction:column"><span style="font-weight:900;font-size:20px;line-height:1" class="${relClass(rel)}">${fmtScore(rel)}</span><span style="color:#4b5563;font-size:10px">vs par ${par}</span></div>`:''}
          </div></div>`:''}
        <button id="save-btn" class="btn btn-full" onclick="submitScore()"
          style="margin-top:4px;font-weight:800;font-size:15px;border:none;transition:all .2s;
          background:${canSave?'linear-gradient(135deg,#ca8a04,#a16207)':'rgba(255,255,255,.06)'};
          color:${canSave?'#fff':'#374151'};
          box-shadow:${canSave?'0 4px 16px rgba(202,138,4,.35)':'none'};
          cursor:${canSave?'pointer':'not-allowed'}">
          💾  Save Score
        </button>
      </div>
      <div>${scHtml}</div>
    </div>`;
}

function syncSaveBtn() {
  const inp=document.getElementById('sv');
  if(inp) SF.strokes=inp.value;
  const ok=!!(SF.gameId&&SF.hole&&parseInt(SF.strokes,10)>0);
  const btn=document.getElementById('save-btn');
  if(!btn)return;
  btn.style.background=ok?'linear-gradient(135deg,#ca8a04,#a16207)':'rgba(255,255,255,.06)';
  btn.style.color=ok?'#fff':'#374151';
  btn.style.boxShadow=ok?'0 4px 16px rgba(202,138,4,.35)':'none';
  btn.style.cursor=ok?'pointer':'not-allowed';
}

function sfGame(id){SF={gameId:id,hole:'',strokes:'',loaded:false};renderScore(document.getElementById('page'));}
function sfHole(h){SF.hole=h;SF.strokes='';SF.loaded=false;renderScore(document.getElementById('page'));}
function adjS(d) {
  const inp=document.getElementById('sv');
  const cur=inp?parseInt(inp.value,10):parseInt(SF.strokes,10);
  SF.strokes=String(Math.max(1,(isNaN(cur)?1:cur)+d));
  SF.loaded=true;
  if(inp)inp.value=SF.strokes;
  syncSaveBtn();
  renderScore(document.getElementById('page'));
}
function submitScore() {
  const inp=document.getElementById('sv');
  if(inp) SF.strokes=inp.value;
  const n=parseInt(SF.strokes,10);
  if(!SF.gameId||!SF.hole||isNaN(n)||n<1)return;
  const score={gameId:SF.gameId,userId:S.currentUser.id,hole:Number(SF.hole),strokes:n,timestamp:new Date().toISOString()};
  saveScore(score);
  SF.hole='';SF.strokes='';SF.loaded=false;
  const btn=document.getElementById('save-btn');
  if(btn){btn.textContent='✅  Saved!';btn.style.background='#16a34a';btn.style.boxShadow='none';}
  setTimeout(()=>renderScore(document.getElementById('page')),900);
}

// ── PROFILE ──
function renderProfile(el) {
  const uid=S.currentUser.id;
  const my=S.scores.filter(s=>s.userId===uid);
  const myGameIds=new Set([...my.map(s=>s.gameId),...S.games.filter(g=>g.createdBy===uid).map(g=>g.id)]);
  const played=myGameIds.size;
  const stats=S.games.filter(g=>g.status==='finished'&&myGameIds.has(g.id)).map(g=>{
    const pars=getPars(g),gs=my.filter(s=>s.gameId===g.id);
    const tot=gs.reduce((a,s)=>a+s.strokes,0),par=gs.reduce((a,s)=>a+(pars[s.hole-1]||4),0);
    const isOwner=g.createdBy===uid;
    const pos=gs.length?calcBoard(g).findIndex(p=>p.user.id===uid)+1:null;
    return{game:g,tot,par,rel:gs.length?tot-par:null,pos,holes:gs.length,isOwner};
  });
  const playedStats=stats.filter(s=>s.holes>0);
  const best=playedStats.length?playedStats.reduce((b,g)=>g.rel<b.rel?g:b):null;
  const avg=playedStats.length?Math.round(playedStats.reduce((a,g)=>a+g.rel,0)/playedStats.length):null;
  const wins=playedStats.filter(g=>g.pos===1).length;
  const isCreator=S.games.some(g=>g.createdBy===uid);

  el.innerHTML=`

    <div class="card-gold fade-up" style="margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:18px;margin-bottom:22px">
        <div style="width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,rgba(202,138,4,.25),rgba(20,83,45,.5));border:2px solid #ca8a04;display:flex;align-items:center;justify-content:center;font-size:30px">🏌️</div>
        <div>
          <div style="font-family:'Playfair Display',serif;color:#fff;font-size:21px;font-weight:700">${esc(S.currentUser.username)}</div>
          <div style="color:${isCreator?'#fbbf24':'#86efac'};font-size:12px;margin-top:4px;font-weight:600">${isCreator?'⚙️  GAME ORGANISER':'🏌️  PLAYER'}</div>
        </div>
      </div>
      <div class="stat-grid">
        ${[['🏆','GAMES',played,null],['🥇','WINS',wins,null],['📊','AVG',avg!==null?fmtScore(avg):'—',avg],['⭐','BEST',best?fmtScore(best.rel):'—',best?best.rel:null]].map(([icon,lbl,val,rv])=>`
          <div class="stat-box"><div style="font-size:22px;margin-bottom:6px">${icon}</div>
          <div style="font-size:20px;font-weight:900;line-height:1" ${rv!==null&&rv!==undefined?`class="${relClass(rv)}"`:''}>${val}</div>
          <div style="color:#4b5563;font-size:11px;margin-top:4px;letter-spacing:.06em">${lbl}</div></div>`).join('')}
      </div>
      ${my.length?`<button class="btn btn-ghost" style="margin-top:18px;padding:9px 18px;font-size:13px" onclick="exportCSV()">📥  Export My Scores (CSV)</button>`:''}
    </div>
    ${stats.length?`<h3 style="font-family:'Playfair Display',serif;color:#fef08a;font-size:17px;margin-bottom:14px">Game History</h3>
      ${stats.map(({game,rel,pos,tot,holes,isOwner})=>`<div style="background:rgba(0,0,0,.32);border-radius:14px;padding:14px 18px;border:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="color:#e5e7eb;font-weight:700;font-size:15px">${esc(game.name)}</span>
            ${isOwner?'<span style="background:rgba(202,138,4,.2);color:#fbbf24;font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.06em">ORGANISER</span>':''}
          </div>
          <div style="color:#4b5563;font-size:12px;margin-top:3px">${esc(game.course)} · ${holes}/${game.holes} holes${game.startTime?' · '+fmtDate(game.startTime):''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          ${rel!==null?`<div style="font-weight:900;font-size:20px;line-height:1" class="${relClass(rel)}">${fmtScore(rel)}</div>
          <div style="color:#6b7280;font-size:12px;margin-top:3px">${pos?'#'+pos+' · ':' '}${tot} strokes</div>`
          :`<div style="color:#6b7280;font-size:12px">Organiser only</div>`}
        </div>
      </div>`).join('')}`
    :`<div class="empty"><div class="icon">📋</div><p style="color:#4b5563">No games yet — get out there!</p></div>`}`;
}

function exportCSV() {
  const my=S.scores.filter(s=>s.userId===S.currentUser.id);
  const rows=[['Game','Course','Date','Hole','Par','Strokes','Score']];
  S.games.forEach(g=>{const pars=getPars(g);my.filter(s=>s.gameId===g.id).sort((a,b)=>a.hole-b.hole).forEach(s=>{const p=pars[s.hole-1]||4;rows.push([g.name,g.course,fmtDate(g.startTime),s.hole,p,s.strokes,fmtScore(s.strokes-p)]);});});
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n'));
  a.download=S.currentUser.username+'-scores.csv';a.click();
}

// ── GAMES TAB ──
function renderGames(el) {
  const uid=S.currentUser.id;
  const joinSection=`
    <div class="join-card fade-up">
      <h2 style="font-family:'Playfair Display',serif;color:#fef08a;font-size:18px;margin-bottom:6px">🔑 Join a Game</h2>
      <p style="color:#86efac;font-size:12px;margin-bottom:16px">Enter the PIN shared by the game organiser to jump straight into score entry.</p>
      <div id="jerr"></div>
      <div class="pin-join-row" style="margin-bottom:0">
        <input class="pin-entry" id="join-pin" maxlength="5" placeholder="Enter PIN"
          oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"
          onkeydown="if(event.key==='Enter')joinByPin()">
        <button class="btn btn-gold" style="flex-shrink:0;padding:12px 20px;white-space:nowrap" onclick="joinByPin()">Join →</button>
      </div>
    </div>`;

  let form='';
  if(AF.open){
    form=`<div class="card-gold fade-up" style="margin-bottom:24px">
      <div style="font-family:'Playfair Display',serif;color:#fef08a;font-size:18px;margin-bottom:18px">Create New Game</div>
      <div class="two-col" style="margin-bottom:14px">
        <div class="form-group" style="margin-bottom:0"><label class="form-label">GAME NAME</label>
          <input class="form-input" id="af-name" value="${esc(AF.name)}" placeholder="e.g. Annual Summer Classic" oninput="AF.name=this.value"></div>
        <div class="form-group" style="margin-bottom:0"><label class="form-label">COURSE</label>
          <input class="form-input" id="af-course" value="${esc(AF.course)}" placeholder="e.g. Pebble Beach" oninput="AF.course=this.value"></div>
      </div>
      <div class="form-group"><label class="form-label">HOLES</label>
        <select class="form-select" style="max-width:160px" onchange="setHoles(this.value)">
          <option value="9"${AF.holes===9?' selected':''}>9 holes</option>
          <option value="18"${AF.holes===18?' selected':''}>18 holes</option>
        </select></div>
      <div><label class="form-label">PAR PER HOLE</label>
        <div style="display:grid;grid-template-columns:repeat(9,1fr);gap:6px">
          ${AF.pars.slice(0,AF.holes).map((p,i)=>`<div style="text-align:center">
            <div style="color:#4b5563;font-size:10px;margin-bottom:3px;font-weight:600">H${i+1}</div>
            <select style="width:100%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:6px 2px;color:#fff;font-size:13px;cursor:pointer;font-family:inherit" onchange="setPar(${i},this.value)">
              ${[3,4,5].map(v=>`<option value="${v}"${p===v?' selected':''}>${v}</option>`).join('')}
            </select></div>`).join('')}
        </div></div>
      <div style="margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <button class="btn btn-gold" onclick="createGame()">⛳  Create Game</button>
        <span style="color:#374151;font-size:12px">Par: ${AF.pars.slice(0,AF.holes).reduce((a,b)=>a+b,0)} · PIN auto-generated</span>
      </div>
    </div>`;
  }

  const list=[...S.games].reverse().map(g=>{
    const pars=getPars(g),pt=pars.reduce((a,b)=>a+b,0);
    const isOwner=g.createdBy===uid;
    const pinBlock=isOwner&&g.pin?`<div class="pin-block">
      <div>
        <div style="color:#86efac;font-size:10px;font-weight:700;letter-spacing:.08em;margin-bottom:5px">🔑 GAME PIN — share with friends</div>
        <span class="pin-code">${esc(g.pin)}</span>
      </div>
      <button class="pin-copy-btn" id="copy-${g.id}" onclick="copyPin('${esc(g.pin)}','copy-${g.id}')">📋 Copy PIN</button>
    </div>`:'';
    return`<div class="game-row${g.status==='live'?' live-row':''} fade-up">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">
            <span style="color:#f3f4f6;font-weight:700;font-size:16px">${esc(g.name)}</span>
            <span class="status-badge status-${g.status}">${g.status==='live'?'● LIVE':g.status.toUpperCase()}</span>
            ${isOwner?'<span style="background:rgba(202,138,4,.15);color:#fbbf24;font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.06em">YOUR GAME</span>':''}
          </div>
          <div style="color:#4b5563;font-size:12px">${esc(g.course)} · ${g.holes} holes · Par ${pt}${g.startTime?' · Started '+fmtDate(g.startTime):''}${g.endTime?' · Ended '+fmtDate(g.endTime):''}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0;align-items:center">
          ${isOwner&&g.status==='pending'?`<button class="btn btn-green" style="padding:8px 16px;font-size:12px" onclick="setStatus('${g.id}','live')">▶ Start</button><button class="btn btn-ghost" style="padding:8px 12px;font-size:13px" onclick="delGame('${g.id}')">🗑</button>`:''}
          ${isOwner&&g.status==='live'?`<button class="btn btn-red" style="padding:8px 16px;font-size:12px" onclick="setStatus('${g.id}','finished')">⏹ End Game</button>`:''}
          ${g.status==='finished'?`<span style="color:#374151;font-size:12px">Completed</span>`:''}
        </div>
      </div>
      ${pinBlock}
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="fade-up" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
      <h1 style="font-family:'Playfair Display',serif;color:#fef08a;font-size:24px">⚙️ Games</h1>
      <button class="btn ${AF.open?'btn-ghost':'btn-gold'}" onclick="toggleForm()">${AF.open?'✕  Cancel':'＋  New Game'}</button>
    </div>
    ${joinSection}
    <div style="margin-top:24px">
      ${form}
      ${!S.games.length&&!AF.open?`<div class="empty" style="border:1px dashed rgba(255,255,255,.07);border-radius:16px"><div class="icon">🏌️</div><p style="color:#4b5563">No games yet — create the first one!</p></div>`:list}
    </div>`;
}

function joinByPin() {
  const pin=(document.getElementById('join-pin')?.value||'').trim().toUpperCase();
  const err=document.getElementById('jerr');
  if(!pin){err.innerHTML='<div class="error-msg">⚠️ Please enter a PIN</div>';return;}
  const game=S.games.find(g=>String(g.pin).toUpperCase()===pin);
  if(!game){err.innerHTML='<div class="error-msg">⚠️ No game found with that PIN</div>';return;}
  S.page='score';SF={gameId:game.id,hole:'',strokes:'',loaded:false};render();
}

function toggleForm(){AF.open=!AF.open;renderGames(document.getElementById('page'));}
function setHoles(n){AF.holes=Number(n);AF.pars=Array(Number(n)).fill(0).map((_,i)=>AF.pars[i]||4);renderGames(document.getElementById('page'));}
function setPar(i,v){AF.pars[i]=Number(v);}

function createGame() {
  const name=(document.getElementById('af-name')?.value||AF.name).trim();
  const course=(document.getElementById('af-course')?.value||AF.course).trim();
  if(!name||!course){alert('Please fill in game name and course.');return;}
  const newGame={id:Date.now().toString(),name,course,holes:AF.holes,pars:JSON.stringify(AF.pars.slice(0,AF.holes)),
    pin:genPin(),status:'pending',createdBy:S.currentUser.id,createdAt:new Date().toISOString(),startTime:null,endTime:null};
  AF={open:false,name:'',course:'',holes:18,pars:Array(18).fill(4)};
  persistGames([...S.games,newGame]);
  renderGames(document.getElementById('page'));
}

function setStatus(id,status) {
  const updated=S.games.map(g=>g.id===id?{...g,status,...(status==='live'?{startTime:new Date().toISOString()}:{}),...(status==='finished'?{endTime:new Date().toISOString()}:{})}:g);
  persistGames(updated);render();
}
function delGame(id) {
  if(!confirm('Delete this game?'))return;
  persistGames(S.games.filter(g=>g.id!==id));
  renderGames(document.getElementById('page'));
}

// ── BOOT ──
render();
loadAll();
</script>
</body>
</html>
